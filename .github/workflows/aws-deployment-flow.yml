name: AWS Deployment Flow
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      OIDCRoleARN:
        description: 'OIDC Role ARN for AWS authentication'
        required: true
        type: string
      AWSRegion:
        description: 'AWS Region for deployment'
        required: true
        type: string
        default: 'us-east-1'
      env:
        description: 'Environment for deployment'
        required: true
        type: string
        default: 'dev'

permissions:
  id-token: write
  contents: read
jobs:
  gets-regions:
    runs-on: ubuntu-latest
    outputs:
      matrix-region: ${{ steps.set-matrix.outputs.regions }}
    steps:
      - name: Parse regions
        id: set-matrix
        run: |
          echo "regions=[\"$(echo '${{ inputs.AWSRegion }}' | sed 's/,/","/g')\"]" >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: gets-regions
    strategy:
      matrix:
        region: ${{ fromJson(needs.gets-regions.outputs.matrix-region)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.OIDCRoleARN }}
          aws-region: ${{ matrix.region }}
          role-duration-seconds: 900

      - name: verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # - name: Terraform Login
      #   run: terraform login
      #   env:
      #     TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      
      - name: Terraform Init
        run: terraform init -backend-config=terraform.${{ inputs.env }}.tfbackend
        working-directory: Terraform

      # - name: Select Workspace
      #   run: |
      #     terraform workspace select django-${{ inputs.env }} || \
      #     terraform workspace new django-${{ inputs.env }}
      #   working-directory: Terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: Terraform

      - name: Terraform Plan
        run: terraform plan -var-file="${{ inputs.env }}.tfvars"
        working-directory: Terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="${{ inputs.env }}.tfvars"
        working-directory: Terraform
      
      - name: Deploy App via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=${{ matrix.env }}-django" \
            --parameters commands='[
              "cd /home/ec2-user/BayerProject",
              "git pull origin main",
              "sudo systemctl restart django"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id $COMMAND_ID
